[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learner-state-sequence-model"
version = "0.1.0"
description = "Descriptive sequence analytics for learner state transitions, entropy, and persistence."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
keywords = ["ai-in-education", "aied", "learning-analytics", "self-regulated-learning", "sequence-analysis", "learner-modeling"]

[project.urls]
Repository = "https://github.com/devissaputra/learner_state_sequence_model"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
