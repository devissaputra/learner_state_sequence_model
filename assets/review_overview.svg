<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img"><title>01 / How often do observed learner states persist or change?</title><desc>SYNTHETIC / RULE-BASED PROTOTYPE | no educational validity claim</desc><rect width="1200" height="840" fill="#f6f8fc"/><text x="48" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#133b65" font-weight="700">01 / How often do observed learner states persist or change?</text><text x="48" y="111" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#526278" font-weight="400">SYNTHETIC / RULE-BASED PROTOTYPE | no educational validity claim</text><rect x="42" y="145" width="1116" height="134" rx="10" fill="white" stroke="#d2dce7"/><rect x="42" y="145" width="7" height="134" fill="#2365a0"/><text x="65" y="177" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#2365a0" font-weight="700">DATA / OBSERVATION UNIT</text><text x="65" y="213" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">A supplied sequence of state labels, not inferred psychological states.</text><rect x="42" y="295" width="1116" height="166" rx="10" fill="white" stroke="#d2dce7"/><rect x="42" y="295" width="7" height="166" fill="#128075"/><text x="65" y="327" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#128075" font-weight="700">DESIGN / COMPARISON</text><text x="65" y="363" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">Count adjacent transitions; normalize outgoing counts; calculate entropy and self-</text><text x="65" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">transition frequency.</text><rect x="42" y="477" width="1116" height="270" rx="10" fill="white" stroke="#d2dce7"/><rect x="42" y="477" width="7" height="270" fill="#8b4d27"/><text x="65" y="509" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#8b4d27" font-weight="700">FINDING / INTERPRETATION</text><text x="65" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">This repository summarizes supplied learner-state sequences through transition</text><text x="65" y="576" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">probabilities, outgoing-state entropy, and persistence. Counts are normalized only where</text><text x="65" y="607" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">transitions are observed, and insufficient sequences return an undefined persistence</text><text x="65" y="638" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">value rather than a fabricated estimate. It is a descriptive baseline for sequence</text><text x="65" y="669" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">analysis; the labels must be justified separately and should not be treated as inferred</text><text x="65" y="700" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#23354b" font-weight="400">mental states.</text><text x="48" y="796" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#23354b" font-weight="400">Read the calculation guide for source paths, assumptions and reproduction status.</text></svg>
